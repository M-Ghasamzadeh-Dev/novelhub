<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="author" content="مهدی قسم زاده">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — NovelHub</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main class="container">
  <div class="form-card">
    <h1>ورود به حساب کاربری</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identifier">ایمیل یا نام کاربری</label>
        <input type="text" id="identifier" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" required>
        <small class="error hidden" id="loginError"></small>
      </div>
      <div class="checkbox-row" style="justify-content:space-between;display:flex;width:100%;">
        <label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="rememberMe"> مرا به خاطر بسپار</label>
        <a href="#" style="color:var(--gold);font-size:.85rem;" id="forgotPasswordLink">فراموشی رمز عبور</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
    </form>
    <p class="form-foot">حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
    <p class="form-foot"><a href="home.html">ادامه به‌صورت مهمان ←</a></p>
  </div>
</main>
<footer id="site-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script>
window.pageInit = function(){
  document.getElementById('loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    const result = Auth.login({identifier, password});
    if(!result.ok){
      errEl.textContent = result.error;
      errEl.classList.remove('hidden');
      return;
    }
    Toast.show('خوش آمدید، ' + result.user.username + '!', 'success');
    setTimeout(()=> location.href = 'home.html', 500);
  });
  document.getElementById('forgotPasswordLink').addEventListener('click', e=>{
    e.preventDefault();
    Toast.show('این نسخه صرفاً یک نمونه‌ی نمایشی است.');
  });
};
</script>
<script src="../js/app.js"></script>
</body>
</html>
