<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="author" content="مهدی قسم زاده">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اعلان‌ها — NovelHub</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main class="container section">
  <div class="section-head"><h2>اعلان‌ها</h2><button class="btn btn-ghost btn-sm" id="markAllBtn">علامت‌گذاری همه به‌عنوان خوانده‌شده</button></div>
  <div class="notif-list" id="notifList"></div>
</main>
<footer id="site-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script>
function seedDemoNotifs(){
  const u = Auth.currentUser();
  const existing = Repo.notifications().filter(n=>n.userId===u.id);
  if(existing.length) return;
  const sample = Repo.novels().slice(0,4);
  const list = Repo.notifications();
  const templates = [
    {icon:'', text:n=>`کاربری رمان «${n.title}» شما را لایک کرد.`},
    {icon:'', text:n=>`نظر جدیدی روی رمان «${n.title}» شما ثبت شد.`},
    {icon:'', text:n=>`فصل جدید رمان مورد علاقه‌ی «${n.title}» منتشر شد.`},
    {icon:'', text:n=>`رمان «${n.title}» شما به علاقه‌مندی‌های یک کاربر اضافه شد.`}
  ];
  sample.forEach((n,i)=>{
    const tpl = templates[i%templates.length];
    list.push({id:'nt_'+i, userId:u.id, icon:tpl.icon, text:tpl.text(n), date:new Date(Date.now()-i*3600000*7).toISOString(), read:i>1});
  });
  Repo.saveNotifications(list);
}

window.pageInit = function(){
  if(!Auth.isLoggedIn()){ location.href = 'login.html'; return; }
  seedDemoNotifs();
  render();

  function render(){
    const u = Auth.currentUser();
    const mine = Repo.notifications().filter(n=>n.userId===u.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const list = document.getElementById('notifList');
    if(!mine.length){
      list.innerHTML = `<div class="empty-state"><h3>اعلانی وجود ندارد.</h3></div>`;
      return;
    }
    list.innerHTML = mine.map(n=>`
      <div class="notif-item ${n.read?'':'unread'}" data-id="${n.id}">
        <div class="notif-body"><p>${n.text}</p><time>${UI.timeAgo(n.date)}</time></div>
      </div>`).join('');
  }

  document.getElementById('markAllBtn').addEventListener('click', ()=>{
    const u = Auth.currentUser();
    const all = Repo.notifications().map(n=> n.userId===u.id ? {...n, read:true} : n);
    Repo.saveNotifications(all);
    render();
    Toast.show('همه اعلان‌ها خوانده‌شده علامت زده شدند.');
  });
};
</script>
<script src="../js/app.js"></script>
</body>
</html>
