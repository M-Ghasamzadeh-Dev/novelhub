<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitleTag">جزئیات رمان — NovelHub</title>
<meta name="description" content="جزئیات، فصل‌ها و نظرات رمان در NovelHub.">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
.novel-hero{ display:grid; grid-template-columns:260px 1fr; gap:36px; padding:44px 0; }
.novel-hero-cover{ border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lift); aspect-ratio:2/3; }
.novel-hero-cover img{ width:100%; height:100%; object-fit:cover; }
.novel-hero-meta{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 20px; }
.novel-hero-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.novel-stats-row{ display:flex; gap:22px; flex-wrap:wrap; margin-top:18px; font-size:.85rem; color:var(--text-muted); }
.novel-stats-row b{ color:var(--text-primary); }
.chapter-list{ display:flex; flex-direction:column; gap:2px; margin-top:14px; }
.chapter-list a{ display:flex; justify-content:space-between; padding:13px 16px; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); font-size:.88rem; color:var(--text-secondary); }
.chapter-list a:hover{ border-color:var(--gold); color:var(--text-primary); }
@media (max-width:760px){ .novel-hero{ grid-template-columns:1fr; } .novel-hero-cover{ max-width:220px; margin:0 auto; } }
</style>
</head>
<body>
<a href="#main" class="skip-link">رفتن به محتوای اصلی</a>
<header id="site-header"></header>

<main id="main" class="container">
  <div id="novelContent"></div>
</main>

<div id="notFoundView" class="container hidden">
  <div class="error-state">
    <div class="icon">📕</div>
    <h1>404</h1>
    <h3>این رمان پیدا نشد</h3>
    <p>ممکن است رمان حذف شده یا آدرس اشتباه باشد.</p>
    <a href="categories.html" class="btn btn-primary">بازگشت به دسته‌بندی‌ها</a>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/novels.js"></script>
<script src="../js/comments.js"></script>
<script>
window.pageInit = function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const novel = Repo.novelById(id);

  if(!novel){
    document.getElementById('main').classList.add('hidden');
    document.getElementById('notFoundView').classList.remove('hidden');
    return;
  }

  document.getElementById('pageTitleTag').textContent = novel.title + ' — NovelHub';
  const author = Repo.authorById(novel.author);
  const chapters = Repo.chapters(novel.id);
  const liked = Novels.isLiked(novel.id);
  const disliked = Novels.isDisliked(novel.id);
  const bookmarked = Novels.isBookmarked(novel.id);
  const lastRead = Reader.getLastRead(novel.id);
  const startHref = 'reader.html?id=' + novel.id + '&c=' + (lastRead || (chapters[0] && chapters[0].id));

  document.getElementById('novelContent').innerHTML = `
    <div class="novel-hero">
      <div class="novel-hero-cover"><img src="${novel.cover}" alt="جلد رمان ${novel.title}"></div>
      <div>
        <h1>${novel.title}</h1>
        <p><a href="profile.html?author=${author.id}" style="color:var(--gold);">${author.name}</a></p>
        <div class="novel-hero-meta">
          <span class="badge">${Novels.statusLabel(novel.status)}</span>
          ${novel.genres.map(g=>`<span class="badge">${genreName(g)}</span>`).join('')}
          ${novel.ageRating!=='general' ? `<span class="badge age-badge">${Novels.ageLabel(novel.ageRating)}</span>` : ''}
        </div>
        <p>${novel.fullDesc}</p>
        <div class="novel-stats-row">
          <span>📖 <b>${chapters.length}</b> فصل</span>
          <span>👁️ <b>${UI.formatNum(novel.views)}</b> بازدید</span>
          <span>👍 <b id="likeCount">${novel.likes}</b> لایک</span>
          <span>👎 <b id="dislikeCount">${novel.dislikes}</b> دیس‌لایک</span>
          <span>🗓️ انتشار: ${new Date(novel.published).toLocaleDateString('fa-IR')}</span>
          <span>🔄 بروزرسانی: ${UI.timeAgo(novel.updated)}</span>
        </div>
        <div class="novel-hero-actions">
          <a href="${startHref}" class="btn btn-primary" id="startReadBtn">${lastRead ? 'ادامه مطالعه' : 'شروع مطالعه'}</a>
          <button class="btn btn-icon ${bookmarked?'active':''}" id="bookmarkBtn" title="افزودن به علاقه‌مندی‌ها">${bookmarked?'★':'☆'}</button>
          <button class="btn-icon ${liked?'active':''}" id="likeBtn" title="لایک">👍</button>
          <button class="btn-icon ${disliked?'active':''}" id="dislikeBtn" title="دیس‌لایک">👎</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <h2>فهرست فصل‌ها</h2>
    <div class="chapter-list">
      ${chapters.map(c=>`<a href="reader.html?id=${novel.id}&c=${c.id}"><span>${c.title}</span><span class="text-muted">${new Date(c.published).toLocaleDateString('fa-IR')}</span></a>`).join('')}
    </div>

    <div class="divider"></div>
    <h2>نظرات (${Repo.comments(novel.id).length})</h2>
    <form class="comment-form" id="commentForm">
      <textarea rows="2" placeholder="${Auth.isLoggedIn() ? 'نظر خود را بنویسید...' : 'برای ثبت نظر ابتدا وارد شوید...'}" required></textarea>
      <button class="btn btn-primary btn-sm" type="submit">ارسال</button>
    </form>
    <div id="commentsList" style="margin-top:10px;"></div>
  `;

  // +18 gate
  if(novel.ageRating === '18' && !sessionStorage.getItem('nh_age_ok_'+novel.id)){
    document.getElementById('main').classList.add('hidden');
    Modal.open({
      icon:'🔞', iconClass:'warn', title:'محتوای بزرگسال',
      body:'این محتوا برای کاربران بزرگسال در نظر گرفته شده است. آیا مایل به ادامه هستید؟',
      actions:[
        {label:'بازگشت', kind:'ghost', onClick:()=>{ history.back(); }},
        {label:'ورود به محتوا', kind:'danger', onClick:()=>{ sessionStorage.setItem('nh_age_ok_'+novel.id,'1'); Modal.close(); document.getElementById('main').classList.remove('hidden'); }}
      ]
    });
  }

  document.getElementById('bookmarkBtn').addEventListener('click', function(){
    const r = Novels.toggleBookmark(novel.id);
    if(r!==null){ this.classList.toggle('active', r); this.textContent = r ? '★' : '☆'; }
  });
  document.getElementById('likeBtn').addEventListener('click', function(){
    const r = Novels.toggleLike(novel.id);
    if(r!==null){
      this.classList.toggle('active', r);
      document.getElementById('likeCount').textContent = Repo.novelById(novel.id).likes;
      document.getElementById('dislikeCount').textContent = Repo.novelById(novel.id).dislikes;
      document.getElementById('dislikeBtn').classList.remove('active');
    }
  });
  document.getElementById('dislikeBtn').addEventListener('click', function(){
    const r = Novels.toggleDislike(novel.id);
    if(r!==null){
      this.classList.toggle('active', r);
      document.getElementById('likeCount').textContent = Repo.novelById(novel.id).likes;
      document.getElementById('dislikeCount').textContent = Repo.novelById(novel.id).dislikes;
      document.getElementById('likeBtn').classList.remove('active');
    }
  });

  const commentsList = document.getElementById('commentsList');
  Comments.render(novel.id, commentsList);
  Comments.bind(novel.id, commentsList, document.getElementById('commentForm'));
};
</script>
<script src="../js/reader.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
