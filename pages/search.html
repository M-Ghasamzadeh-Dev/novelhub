<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جستجوی رمان | شب‌نامه</title>
  <meta name="description" content="جستجوی پیشرفته‌ی رمان بر اساس عنوان، نویسنده، ژانر و تگ با فیلتر وضعیت، رده سنی و مرتب‌سازی.">
  <meta name="theme-color" content="#0e0c12">
  <meta name="robots" content="index, follow">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="شب‌نامه">
  <meta property="og:title" content="جستجوی رمان | شب‌نامه">
  <meta property="og:description" content="جستجوی پیشرفته‌ی رمان بر اساس عنوان، نویسنده، ژانر و تگ با فیلتر وضعیت، رده سنی و مرتب‌سازی.">
  <meta property="og:image" content="../assets/images/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <!-- فونت‌ها: وزیرمتن برای رابط کاربری، نسخ برای متن ادبی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Vazirmatn:wght@300;400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- تم قبل از رندر اعمال می‌شود تا صفحه چشمک نزند -->
  <script src="../js/theme.js"></script>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>
  <main id="main" class="page" tabindex="-1">
    <header class="page-head container"><p class="eyebrow">کتابخانه</p><h1 id="searchTitle">کاوش در رمان‌ها</h1></header>
    <section class="container" aria-label="جستجو و نتایج">
      <form id="searchForm" class="search-bar" role="search">
        <div class="input-icon search-bar__input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr-only" for="searchInput">عبارت جستجو</label><input id="searchInput" class="input input--lg" type="search" placeholder="عنوان، نویسنده، ژانر یا تگ…" autocomplete="off"></div>
        <label class="sr-only" for="searchField">جستجو در</label>
        <select id="searchField" class="input input--lg hide-mobile"><option value="all">همه‌ی فیلدها</option><option value="title">عنوان</option><option value="author">نویسنده</option><option value="genre">ژانر</option><option value="tag">تگ</option></select>
        <button type="button" class="btn btn--ghost btn--lg filters-toggle" id="filtersToggle" aria-controls="filters" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>فیلترها <span class="chip chip--xs chip--gold" id="filterCount"></span></button>
      </form>
      <div class="search-layout">
        <aside class="filters panel" id="filters" aria-label="فیلترهای جستجو">
          <div class="filters__head"><h2>فیلترها</h2><button type="button" class="icon-btn filters__close" id="filtersClose" aria-label="بستن فیلترها"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
          <fieldset><legend>ژانر</legend><div class="chip-checks" id="genreFilters"></div></fieldset>
          <fieldset><legend>وضعیت</legend><div class="segmented">
            <label><input type="radio" name="status" value="" checked><span>همه</span></label>
            <label><input type="radio" name="status" value="completed"><span>تکمیل شده</span></label>
            <label><input type="radio" name="status" value="ongoing"><span>در حال انتشار</span></label></div></fieldset>
          <fieldset><legend>رده سنی</legend><div class="segmented">
            <label><input type="radio" name="age" value="" checked><span>همه</span></label>
            <label><input type="radio" name="age" value="all"><span>عمومی</span></label>
            <label><input type="radio" name="age" value="13"><span>+۱۳</span></label>
            <label><input type="radio" name="age" value="16"><span>+۱۶</span></label>
            <label><input type="radio" name="age" value="18"><span>+۱۸</span></label></div></fieldset>
          <fieldset><legend>نوع محتوا</legend><div class="segmented">
            <label><input type="radio" name="type" value="" checked><span>همه</span></label>
            <label><input type="radio" name="type" value="text"><span>متن</span></label>
            <label><input type="radio" name="type" value="image"><span>تصویر</span></label>
            <label><input type="radio" name="type" value="mixed"><span>متن + تصویر</span></label></div></fieldset>
          <button type="button" class="btn btn--ghost btn--block" id="resetFilters"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>پاک کردن فیلترها</button>
        </aside>
        <div class="results">
          <div class="results-head">
            <p id="resultCount" aria-live="polite"></p>
            <div class="chip-row" id="activeFilters"></div>
            <label class="select-wrap"><span class="sr-only">مرتب‌سازی</span>
              <select id="sortSelect" class="input"><option value="newest">جدیدترین</option><option value="popular">محبوب‌ترین</option><option value="views">بیشترین بازدید</option><option value="rating">بالاترین امتیاز</option></select></label>
          </div>
          <div id="results" class="novel-grid" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/favorites.js"></script>
  <script src="../js/comments.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/novels.js"></script>
  <script src="../js/reader.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
