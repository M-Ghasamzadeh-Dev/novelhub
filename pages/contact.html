<body data-page="contact">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>
  <main id="main" class="page" tabindex="-1">
    <header class="page-head container"><p class="eyebrow">گفت‌وگو</p><h1>تماس با ما</h1><p class="page-head__lead">سؤال، پیشنهاد یا گزارش تخلف؟ معمولاً ظرف ۲۴ ساعت پاسخ می‌دهیم.</p></header>
    <section class="container static-page">
      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><div><strong>ایمیل پشتیبانی</strong><span dir="ltr">support@shabnameh.ir</span></div></div>
          <div class="contact-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><div><strong>تلفن</strong><span dir="ltr">۰۲۱-۱۲۳۴۵۶۷۸</span></div></div>
          <div class="contact-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div><strong>نشانی</strong><span>تهران، خیابان انقلاب، کوچه‌ی کتاب</span></div></div>
        </div>
        <form class="panel auth-form" id="contactForm" novalidate style="margin-top:0">
          <div class="form-row">
            <div class="field"><label for="cName">نام</label><input id="cName" name="name" class="input" autocomplete="name" required></div>
            <div class="field"><label for="cEmail">ایمیل</label><input id="cEmail" name="email" type="email" class="input" autocomplete="email" dir="ltr" required></div>
          </div>
          <div class="field"><label for="cSubject">موضوع</label><select id="cSubject" name="subject" class="input" required><option value="">انتخاب کنید…</option><option>پشتیبانی فنی</option><option>همکاری و تبلیغات</option><option>گزارش تخلف یا کپی</option><option>پیشنهاد و انتقاد</option></select></div>
          <div class="field"><label for="cMessage">پیام</label><textarea id="cMessage" name="message" class="input" rows="6" required></textarea></div>
          <button type="submit" class="btn btn--primary btn--lg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m22 2-7 20-4-9-9-4z"/></svg>ارسال پیام</button>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
