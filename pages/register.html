<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ثبت‌نام | شب‌نامه</title>
  <meta name="description" content="ساخت حساب کاربری رایگان در شب‌نامه برای انتشار رمان و تعامل با نویسندگان.">
  <meta name="theme-color" content="#0e0c12">
  <meta name="robots" content="index, follow">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="شب‌نامه">
  <meta property="og:title" content="ثبت‌نام | شب‌نامه">
  <meta property="og:description" content="ساخت حساب کاربری رایگان در شب‌نامه برای انتشار رمان و تعامل با نویسندگان.">
  <meta property="og:image" content="../assets/images/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <!-- فونت‌ها: وزیرمتن برای رابط کاربری، نسخ برای متن ادبی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Vazirmatn:wght@300;400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- تم قبل از رندر اعمال می‌شود تا صفحه چشمک نزند -->
  <script src="../js/theme.js"></script>
</head>
<body data-page="register">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>
  <main id="main" class="page" tabindex="-1">
    <div class="auth-page">
      <aside class="auth-art" aria-hidden="true"><span class="auth-art__moon"></span>
          <blockquote>«هر شب، کسی جایی از این شهر قصه‌ای می‌نویسد که قرار است تو بخوانی‌اش.»<cite>شب‌نامه</cite></blockquote></aside>
      <section class="auth-main">
        <div class="auth-card">
          <h1>به شب‌نامه بپیوندید</h1>
          <p>حساب بسازید و اولین فصل قصه‌تان را منتشر کنید.</p>
          <form id="registerForm" class="auth-form" novalidate>
            <div class="field"><span class="label">عکس پروفایل</span><div id="avatarUploader"></div></div>
            <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" class="input" type="text" autocomplete="username" dir="ltr" placeholder="example_user" required><span class="field__hint">حروف انگلیسی، عدد، _ و . (۳ تا ۲۰ کاراکتر)</span></div>
            <div class="field"><label for="email">ایمیل</label><input id="email" name="email" class="input" type="email" autocomplete="email" dir="ltr" placeholder="you@example.com" required></div>
            <div class="field"><label for="regPassword">رمز عبور</label><div class="password-field"><input id="regPassword" name="password" class="input" type="password" autocomplete="new-password" required dir="ltr"><button type="button" data-toggle-password="regPassword" aria-label="نمایش رمز عبور"></button></div><div class="password-meter" id="passwordMeter" data-score="0"><span></span></div></div>
            <div class="field"><label for="confirm">تکرار رمز عبور</label><div class="password-field"><input id="confirm" name="confirm" class="input" type="password" autocomplete="new-password" required dir="ltr"><button type="button" data-toggle-password="confirm" aria-label="نمایش رمز عبور"></button></div></div>
            <div class="field"><label class="check"><input type="checkbox" name="rules" id="rules" required><span><a href="rules.html" target="_blank" rel="noopener">قوانین سایت</a> را مطالعه کرده‌ام و قبول دارم.</span></label></div>
            <button type="submit" class="btn btn--primary btn--lg btn--block">ثبت‌نام</button>
          </form>
          <p class="auth-switch">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/favorites.js"></script>
  <script src="../js/comments.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/novels.js"></script>
  <script src="../js/reader.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
